<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System | Project Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epunda+Sans:wght@400;500;600;700&family=Epunda+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}">
</head>
<body class="map-page">
  <header class="map-header">
    <a href="/" class="map-brand">Student Management System</a>
    <span>Project structure</span>
  </header>
  <main class="map-shell">
    <aside class="map-panel">
      <h1>Project map</h1>
      <p class="map-intro">Explore the planned pages and people who use the student management system.</p>
      <div class="layout-choice" aria-label="Map layout">
        <span>Layout:</span>
        <button type="button" data-layout-choice="tree">Tree</button>
        <span aria-hidden="true">|</span>
        <button type="button" data-layout-choice="radial">Radial</button>
      </div>
      <div class="map-tools">
        <label for="map-search">Search map</label>
        <input id="map-search" type="search" placeholder="Search pages or actors">
        <label for="map-filter">Show</label>
        <select id="map-filter">
          <option value="all">All items</option>
          <option value="actors">Actors</option>
          <option value="pages">Pages</option>
        </select>
        <label class="problem-toggle"><input id="problems-only" type="checkbox"> Only show problems</label>
        <button type="button" class="map-text-button" id="download-png">Download PNG</button>
        <div id="map-details" class="map-details">Select a node to see its details.</div>
        <p class="map-hint">Click a node to expand or collapse it. Use arrow keys to move between nodes.</p>
      </div>
    </aside>
    <section class="map-canvas-wrap" aria-label="Interactive project map">
      <svg id="mindmap" role="img" aria-label="Interactive student management system map"></svg>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="{{ url_for('static', filename='mindmap-data.js') }}"></script>
  <script src="{{ url_for('static', filename='mindmap.js') }}"></script>
  {% if run_layout_tests %}
  <script src="{{ url_for('static', filename='mindmap-layout.test.js') }}"></script>
  {% endif %}
</body>
</html>
